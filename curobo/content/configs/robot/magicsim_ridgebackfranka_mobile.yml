#
# RidgebackFranka with a free floating base (base + arm planning, 10 DOF + 2 locked fingers).
# Uses ``ridgeback_franka.urdf`` whose chain adds 3 dummy base joints
# (prismatic X, prismatic Y, revolute Z) between panda_mobile and base_link.
# cspace_distance_weight + null_space_weight on the base joints are 10x the arm weights,
# so the IK seed (and PRM graph) prefer arm-only solutions and only move the base when
# geometric reach requires it. Bump to 50-100 if the base still moves too eagerly.
