# FK-only links (migrated from v1 ``kinematics.extra_link_names``).
# Placed at YAML top level so cuRobo v2's RobotCfg loader ignores it;
# PlannerManager reads + merges them into kinematics.tool_frames before
# building the solver, then applies ToolPoseCriteria.disabled() so they
# contribute zero cost to both IK and MotionGen trajopt.
