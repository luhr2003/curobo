##
## Three-arm UR10e — migrated from the v1 tri_ur10e.yml.
## v1 ``ee_link`` + ``link_names`` (two separate fields) collapsed into
## the v2 ``tool_frames`` list. Collision spheres inlined (v2 doesn't
## support the legacy ``spheres/*.yml`` file path) — arms 0 and 1 are
## copied from ``dual_ur10e.yml``, arm 2 is the same set of per-arm
## spheres with the ``_2`` suffix.
robot_cfg:
  kinematics:
    urdf_path: "robot/ur_description/tri_ur10e.urdf"
    asset_root_path: "robot/ur_description"
    base_link: "base_fixture_link"
    tool_frames: ["tool0", "tool1", "tool2"]
    collision_link_names: [
      'shoulder_link','upper_arm_link', 'forearm_link', 'wrist_1_link', 'wrist_2_link' ,'wrist_3_link', 'tool0',
      'shoulder_link_1','upper_arm_link_1', 'forearm_link_1', 'wrist_1_link_1', 'wrist_2_link_1' ,'wrist_3_link_1', 'tool1',
